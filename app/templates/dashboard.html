<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniStream-AI | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">OmniStream-AI</a>
        </div>
    </nav>

    <div class="container">
        <!-- Header Section -->
        <div class="text-center mb-5">
            <h2 class="display-6 fw-bold">Your Personalized Content Clusters</h2>
            <p class="text-muted fs-5">Analyzing your recent history using K-Means and Zero-Shot Classification...</p>
            <button id="generateBtn" class="btn btn-primary btn-lg mt-3 px-5 shadow-sm">
                Generate Recommendations
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="text-center d-none my-5">
            <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h5>Crunching data across Reddit, Hugging Face, and Google Custom Search...</h5>
            <p class="text-muted">This usually takes 5-15 seconds depending on API response times.</p>
        </div>

        <!-- Results Grid -->
        <div id="results" class="row g-4 d-none">
            <!-- Cluster cards will be injected here dynamically -->
        </div>
    </div>

    <script>
        document.getElementById('generateBtn').addEventListener('click', async (e) => {
            const btn = e.target;
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            
            // Set UI to loading state
            btn.disabled = true;
            btn.innerHTML = 'Processing Pipeline...';
            loading.classList.remove('d-none');
            results.classList.add('d-none');
            results.innerHTML = ''; 

            try {
                // Trigger the backend ML pipeline
                const response = await fetch('/api/dashboard/generate-recommendations');
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || 'Failed to fetch recommendations. Are you logged in?');

                // Inject the data into the UI
                for (const [genre, details] of Object.entries(data.data)) {
                    const keywords = details.keywords.join(', ');
                    
                    let articlesHtml = '<ul class="list-group list-group-flush rounded">';
                    details.articles.forEach(article => {
                        articlesHtml += `
                            <li class="list-group-item bg-transparent px-0 border-light">
                                <a href="${article.link}" target="_blank" class="text-decoration-none fw-semibold">
                                    ${article.title}
                                </a>
                            </li>`;
                    });
                    articlesHtml += '</ul>';

                    const cardHtml = `
                        <div class="col-md-4">
                            <div class="card h-100 shadow-sm border-0">
                                <div class="card-header bg-primary text-white py-3">
                                    <h5 class="mb-0">${genre}</h5>
                                </div>
                                <div class="card-body bg-white">
                                    <div class="mb-3 pb-3 border-bottom">
                                        <small class="text-uppercase text-muted fw-bold">Extracted Keywords</small><br>
                                        <span class="text-secondary">${keywords}</span>
                                    </div>
                                    <small class="text-uppercase text-muted fw-bold d-block mb-2">Web Recommendations</small>
                                    ${articlesHtml}
                                </div>
                            </div>
                        </div>
                    `;
                    results.innerHTML += cardHtml;
                }
                
                results.classList.remove('d-none');
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                // Reset UI state
                loading.classList.add('d-none');
                btn.disabled = false;
                btn.innerHTML = 'Generate Recommendations';
            }
        });
    </script>
</body>
</html>
