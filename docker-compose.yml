version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
      - 8.8.4.4

    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: