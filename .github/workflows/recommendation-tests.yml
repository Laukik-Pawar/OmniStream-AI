name: Recommendation engine tests

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/recommendation-tests.yml"
  push:
    branches:
      - main
      - improve/hybrid-recommendations

jobs:
  recommendation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip Flask numpy scipy scikit-learn
      - name: Compile application modules
        run: python -m compileall -q app
      - name: Run recommendation tests
        run: python -m unittest discover -s tests -p "test_*.py"
